<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <radialGradient id="glow" cx="50%" cy="39%" r="30%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Subtle blue glow behind icon -->
  <rect width="1280" height="640" fill="url(#glow)"/>
  <!-- Icon: blue rounded square (logo icon scaled 48→140, factor ≈2.917) -->
  <rect x="570" y="180" width="140" height="140" rx="28" fill="#1f6feb"/>
  <!-- Clock face -->
  <circle cx="640" cy="250" r="41" fill="none" stroke="#0F1117" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Clock hands -->
  <polyline points="640,225.5 640,250 656.3,258.2" fill="none" stroke="#0F1117" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wordmark (white — for dark backgrounds) -->
  <text x="640" y="415" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700" font-size="96" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">PunchIn</text>
  <!-- Tagline -->
  <text x="640" y="460" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="400" font-size="26" fill="#6B7280" text-anchor="middle">Precision time tracking for freelancers</text>
  <!-- Blue accent bar -->
  <rect x="0" y="628" width="1280" height="3" fill="#1f6feb" opacity="0.6"/>
</svg>
