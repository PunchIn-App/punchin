<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale / user-scalable=no — pinch-zoom must stay enabled (WCAG 1.4.4);
         the 300ms tap delay is handled via `touch-action: manipulation` in index.css.
         viewport-fit=cover is required for `env(safe-area-inset-*)` to resolve. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PunchIn" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <meta name="description" content="Precision time tracking for freelancers" />
    <title>PunchIn</title>

    <!-- Canonical + Open Graph (https://ogp.me/) -->
    <link rel="canonical" href="https://trackmytime.today/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PunchIn" />
    <meta property="og:url" content="https://trackmytime.today/" />
    <meta property="og:title" content="PunchIn — Precision time tracking for freelancers" />
    <meta property="og:description" content="Free, offline-first time tracking for freelancers. Punch in and out, categorize work, watch live earnings, and export invoices — all on your device, no account required." />
    <meta property="og:image" content="https://trackmytime.today/social-card.png" />
    <meta property="og:image:secure_url" content="https://trackmytime.today/social-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The PunchIn mobile timer screen showing two running job timers with live earnings, beside the PunchIn wordmark and the tagline ‘Precision time tracking for freelancers.’" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PunchIn — Precision time tracking for freelancers" />
    <meta name="twitter:description" content="Free, offline-first time tracking for freelancers. Punch in/out, categorize work, watch live earnings, and export invoices — all on your device, no account." />
    <meta name="twitter:image" content="https://trackmytime.today/social-card.png" />
    <meta name="twitter:image:alt" content="The PunchIn mobile timer screen showing two running job timers with live earnings, beside the PunchIn wordmark and tagline." />
    <!-- Brand fonts are self-hosted (no CDN); @font-face lives in src/index.css.
         Preload the body face to cut first-paint FOUT. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/noto-sans-latin-wght-normal.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../src/main.jsx"></script>
  </body>
</html>
