# Single source of truth for the PunchIn project (#1) status updates — covers
# the WHOLE project (both repos) from one place:
#   - weekly (Monday)                  — a digest of the last 7 days
#   - on a punchin release              — a "shipped vX.Y.Z" update
#   - on a punchin-email release        — same, via repository_dispatch relay
#                                         (punchin-email/notify-status-update.yml)
# Status flag is auto-derived: AT_RISK if any open P0 items, else ON_TRACK.
# Runs under ADD_TO_PROJECT_PAT (Projects + Issues read/write, Contents read).
name: Project status update

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  release:
    types: [published]
  repository_dispatch:
    types: [email-release] # relayed from a punchin-email release
  workflow_dispatch:

permissions: {}

# One status post at a time. Cancelling is not an option: a release and the
# Monday cron can coincide, and each is a distinct update that should be posted,
# not dropped — so they queue rather than clobber each other.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  post-update:
    runs-on: ubuntu-latest
    # A handful of search queries plus one project write.
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          script: |
            const owner = 'PunchIn-App';
            const repos = ['punchin', 'punchin-email'];
            const since = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
            const count = (q) => github.rest.search.issuesAndPullRequests({ q, per_page: 1 })
              .then(r => r.data.total_count).catch(() => 0);

            let merged = 0, opened = 0, closed = 0, openItems = 0;
            const mergedBy = {};
            for (const r of repos) {
              const base = `repo:${owner}/${r}`;
              const m = await count(`${base} is:pr is:merged merged:>=${since}`);
              mergedBy[r] = m; merged += m;
              opened += await count(`${base} is:issue created:>=${since}`);
              closed += await count(`${base} is:issue closed:>=${since}`);
              openItems += await count(`${base} is:open`);
            }

            // Open Urgent-priority items drive the status flag.
            const proj = await github.graphql(`query($o:String!,$n:Int!){ organization(login:$o){ projectV2(number:$n){ id
              items(first:100){ nodes{
                p:fieldValueByName(name:"Priority"){ ... on ProjectV2ItemFieldSingleSelectValue{ name } }
                content{ ... on Issue{ state } ... on PullRequest{ state } } } } } } }`, { o: owner, n: 1 });
            const pid = proj.organization.projectV2.id;
            const openP0 = proj.organization.projectV2.items.nodes
              .filter(i => i.p && i.p.name === 'Urgent' && i.content && i.content.state === 'OPEN').length;

            // A release update comes either from this repo's own release event
            // or relayed from a punchin-email release via repository_dispatch.
            const relayed = context.eventName === 'repository_dispatch';
            const isRelease = context.eventName === 'release' || relayed;
            let relRepo = '', relTag = '';
            if (context.eventName === 'release') { relRepo = context.repo.repo; relTag = context.payload.release.tag_name; }
            else if (relayed) { relRepo = context.payload.client_payload.repo || 'punchin-email'; relTag = context.payload.client_payload.tag || ''; }

            let version = relTag;
            if (!isRelease) { try { version = (await github.rest.repos.getLatestRelease({ owner, repo: 'punchin' })).data.tag_name; } catch (e) {} }

            const headline = isRelease
              ? `🚀 Shipped ${relRepo} ${relTag}`
              : `Week of ${new Date().toISOString().slice(0, 10)}`;
            const status = openP0 > 0 ? 'AT_RISK' : 'ON_TRACK';
            const body = [
              `**${headline}**${version ? ` — latest release **${version}**` : ''}`,
              ``,
              `- ✅ **${merged}** PRs merged (punchin ${mergedBy['punchin'] || 0} · punchin-email ${mergedBy['punchin-email'] || 0})`,
              `- 🐛 **${opened}** issues opened, **${closed}** closed`,
              `- 📋 **${openItems}** open items · **${openP0}** P0`,
              ``,
              `_Auto-generated from repo activity over the last 7 days._`,
            ].join('\n');

            const today = new Date().toISOString().slice(0, 10);
            const target = new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10);
            await github.graphql(`mutation($p:ID!,$b:String!,$s:ProjectV2StatusUpdateStatus!,$sd:Date,$td:Date){
              createProjectV2StatusUpdate(input:{projectId:$p, body:$b, status:$s, startDate:$sd, targetDate:$td}){ statusUpdate{ id status } } }`,
              { p: pid, b: body, s: status, sd: today, td: target });
            core.info(`Posted ${status} update (${headline})`);
