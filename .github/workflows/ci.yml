name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Restrict the default GITHUB_TOKEN to read-only. This workflow only checks out
# code, builds, tests, and uploads an artifact — none of which need write scopes.
permissions:
  contents: read

# One run per PR (or per branch on push): a rapid series of pushes to the same PR
# cancels its own superseded runs instead of queueing them all. Only the newest
# commit's result is meaningful for a merge decision, and nothing here deploys or
# publishes, so cancelling mid-run is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    # Install + build + instrumented suite is a few minutes; 30 is a backstop
    # against a hung run burning the full 6-hour default.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # npm ci installs exactly what package-lock.json pins and fails on
        # package.json/lockfile drift, so CI is reproducible and a transitive
        # in-range release can't silently change behaviour (issue #166).
        run: npm ci

      - name: Build
        run: npm run build

      # `wrangler deploy --dry-run` resolves wrangler.jsonc and bundles the Worker
      # without touching Cloudflare, so a broken worker entry point or config fails
      # here rather than at deploy time. Runs after Build because the config's
      # assets directory is ./dist. Both sibling Workers gate on the same check.
      - name: Bundle check (wrangler dry-run)
        run: npm run check

      # This runs the WHOLE suite under v8 instrumentation and enforces the
      # coverage thresholds, so a separate `npm run test:run` step would just run
      # every test a second time for the same signal.
      - name: Test & coverage (enforce thresholds)
        run: npm run coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
